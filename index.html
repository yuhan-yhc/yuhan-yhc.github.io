<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academic Homepage</title>
  <meta name="description" content="Personal academic homepage">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/img/avatar-placeholder.svg">
  <!-- Apply saved / system theme before first paint to avoid a flash -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="vendor/js-yaml.min.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="top">
    <nav class="nav container" aria-label="Primary">
      <a class="nav-brand" href="#top" data-bind="name">Home</a>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#publications">Publications</a></li>
        <li><a href="#experience">Experience</a></li>
      </ul>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>
      </button>
    </nav>
  </header>

  <main id="main" class="container" tabindex="-1">
    <section id="about" class="section about" aria-labelledby="about-heading">
      <div class="about-photo-wrap">
        <img class="about-photo" id="profile-photo" alt="" width="200" height="200" decoding="async">
      </div>
      <div class="about-body">
        <h1 id="about-heading" class="about-name"><span data-bind="name"></span> <span class="about-name-alt" data-bind="name_alt"></span></h1>
        <p class="about-title"><span data-bind="title"></span><span class="about-sep" aria-hidden="true"></span><span id="affiliation"></span></p>
        <p class="about-location" id="location" hidden></p>
        <ul class="social" id="social-links" aria-label="Links"></ul>
        <div class="bio" id="bio"></div>
        <ul class="tags" id="interests" aria-label="Research interests"></ul>
      </div>
    </section>

    <section id="publications" class="section" aria-labelledby="pub-heading">
      <div class="section-head">
        <h2 id="pub-heading">Publications</h2>
        <div class="pub-filter" role="group" aria-label="Filter publications" hidden>
          <button type="button" data-filter="selected" aria-pressed="true">Selected</button>
          <button type="button" data-filter="all" aria-pressed="false">All</button>
        </div>
      </div>
      <p class="pub-legend" id="pub-legend" hidden><span>*</span> equal contribution</p>
      <div id="pub-list" class="pub-list" aria-live="polite"></div>
    </section>

    <section id="experience" class="section" aria-labelledby="exp-heading">
      <div class="section-head"><h2 id="exp-heading">Experience</h2></div>
      <div class="exp-grid">
        <div class="exp-col">
          <h3 class="exp-sub">Education</h3>
          <ol class="timeline" id="education"></ol>
        </div>
        <div class="exp-col">
          <h3 class="exp-sub">Work</h3>
          <ol class="timeline" id="work"></ol>
        </div>
      </div>
    </section>

    <noscript><p class="notice">This site needs JavaScript enabled to load its content.</p></noscript>
    <p class="notice" id="load-error" hidden></p>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p id="copyright">&copy; <span data-bind="name"></span></p>
      <p id="footer-note" hidden></p>
      <a class="to-top" href="#top">Back to top ↑</a>
    </div>
  </footer>
</body>
</html>
