bio: |
  I am a Ph.D. student at **National Taiwan University**, advised by
  [Prof. Shou-De Lin](https://mslab.csie.ntu.edu.tw/) at the
  [Machine Intelligence and Agentic System Lab (MSLab)](https://mslab.csie.ntu.edu.tw/).
  My research interests include *Large Language Models*, *AI Agents*, and
  *Agent Simulation*.

  I currently lead the **Agent Simulation team** at MSLab, where we are working
  to answer a practical question: how should humans and AI collaborate?

